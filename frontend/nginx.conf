# ============================================================
#  Анти-DDoS / анти-флуд (определяется в http-контексте через conf.d)
# ============================================================
# Зоны лимитирования по IP клиента ($binary_remote_addr — компактный ключ).
#   req_general — общий поток (фронт на нативных ESM-модулях тянет много
#                 .js за один заход, поэтому лимит щедрый, но отсекает флуд);
#   req_api     — обращения к API (тут перебор паролей и автоматизация);
#   conn        — одновременные соединения с одного IP.
limit_req_zone $binary_remote_addr zone=req_general:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=req_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# При срабатывании лимита отдаём 429 (а не 503 по умолчанию).
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Не раскрываем версию nginx в заголовке Server.
    server_tokens off;

    # --- Защита от флуда и медленных атак (slowloris) ---
    # Не более 100 одновременных соединений с одного IP.
    limit_conn conn_per_ip 100;
    # Общий лимит запросов: 50 r/s + всплеск до 100 без задержки.
    limit_req zone=req_general burst=100 nodelay;
    # Ограничиваем размер тела запроса (изображения и так жмутся на клиенте).
    client_max_body_size 12m;
    # Таймауты против медленных запросов, удерживающих соединение.
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;

    # --- Заголовки безопасности (применяются ко всем ответам этого server) ---
    # Защита от кликджекинга.
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Запрет MIME-sniffing.
    add_header X-Content-Type-Options "nosniff" always;
    # Меньше утечки реферера на сторонние сайты.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Отключаем неиспользуемые мощные API браузера.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    # Контентная политика: скрипты только свои, без сторонних источников;
    # стили — свои + инлайновые (в коде есть style="" и внедряемые <style>) +
    # google fonts; картинки — свои, data: и любые https.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    location ^~ /media/ {
        alias /app/media/;
    }

    # Долгий кэш статики. Используем только expires (без add_header), чтобы
    # сюда унаследовались заголовки безопасности из server-блока.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
    }

    location /api/ {
        # Более строгий лимит для API: 10 r/s + всплеск до 20.
        # Защищает от перебора паролей и автоматизированного флуда.
        limit_req zone=req_api burst=20 nodelay;

        # Убираем заголовки, которые проставит сам Django, чтобы не было
        # дублей — единый источник заголовков безопасности здесь, в nginx.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;

        proxy_pass http://hotel-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
