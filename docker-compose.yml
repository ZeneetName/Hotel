services:
  db:
    image: postgres:16
    container_name: hotel-db
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - local_network

  backend:
    build:
      context: backend
    container_name: hotel-backend
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - local_network

  frontend:
    build:
      context: frontend
    container_name: hotel-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - local_network

networks:
  local_network:

volumes:
  pgdata:
  backend_media:
